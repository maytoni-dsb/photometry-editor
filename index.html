<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='12' r='9' fill='none' stroke='%23d72632' stroke-width='3'/%3E%3Cpath d='M16 21v8' stroke='%23005eaa' stroke-width='3'/%3E%3C/svg%3E" />
    <title>Photometry Editor</title>
  </head>
  <body>
    <!-- Текст ниже виден, только если приложение не запустилось (React заменяет содержимое #root) -->
    <div id="root">
      <div id="boot" style="font: 15px/1.5 system-ui, sans-serif; max-width: 640px; margin: 15vh auto; padding: 0 16px; color: #444">
        <p>Загрузка… / Loading…</p>
        <p id="boot-help" hidden>
          Приложение не запустилось. Если сайт открыт с GitHub Pages, проверьте настройку
          <b>Settings → Pages → Build and deployment → Source: GitHub Actions</b>
          и что последний запуск «Pages» на вкладке Actions зелёный.
        </p>
      </div>
    </div>
    <script>
      setTimeout(function () {
        var h = document.getElementById('boot-help');
        if (h) h.hidden = false;
      }, 4000);
    </script>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
